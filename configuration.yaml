
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include_dir_merge_list sensor

wake_on_lan:
switch:
  - platform: wake_on_lan
    mac: 58:96:0A:4C:1B:3F
    name: "tv_living"
    turn_off:
      service: media_player.turn_off
      target:
        entity_id: media_player.lg_webos_tv_oled77g45lw_dpiqljp
        

  - platform: wake_on_lan
    mac: 58:96:0A:9E:E9:99
    name: "tv_detskaia"
    turn_off:
      service: media_player.turn_off
      target:
        entity_id: media_player.lg_webos_tv_oled48c44la_dpiqljp
        
  - platform: wake_on_lan
    mac: 58:96:0A:46:87:CC
    name: "tv_master"
    turn_off:
      service: media_player.turn_off
      target:
        entity_id: media_player.lg_webos_tv_oled55c44la_dpiqljp        
        

template:
  - switch:
      - name: "Тюль ливинг switch"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008836dce_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008836dce_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008836dce_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008836dce_l1

      - name: "Шторы ливинг"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0007ef56a3_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0007ef56a3_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0007ef56a3_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0007ef56a3_l1

      - name: "Шторы кухня"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008304ef3_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008304ef3_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008304ef3_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008304ef3_l1

      - name: "Мастер шторы л"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008302489_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008302489_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0008302489_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0008302489_l1

      - name: "Мастер шторы п"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0007e562c7_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0007e562c7_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d0007e562c7_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d0007e562c7_l1

      - name: "Мастер шторы ливинг"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d00065a07c8_l1
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d00065a07c8_l2
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x00158d00065a07c8_l2
          - delay: "00:00:0.5"
          - service: switch.turn_on
            target:
              entity_id: switch.0x00158d00065a07c8_l1
  - sensor:
      - name: "day"
        state: >
          {{ ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][now().weekday()] }}
      - name: "date"
        state: >
          {% set months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] %}
          {{ now().day | string + ' ' + months[now().month - 1] }}  

     
