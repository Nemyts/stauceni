# automation WC Master

- alias: "mastervana_on"
  trigger:
  - platform: state
    entity_id: 
      - binary_sensor.0x00158d0006b7d27e_contact
      - binary_sensor.0x00158d0009cded84_occupancy
    to: 'on'
  condition:
  - condition: state
    entity_id: switch.spoty_master_vana
    state: 'off'
  - condition: time
    after: "07:00:00"
    before: "23:00:00"
  action:
  - service: switch.turn_on
    entity_id: switch.spoty_master_vana
- alias: "mastervana_off"
  trigger:
  - platform: template
    value_template: >
      {{ is_state('binary_sensor.0x00158d0006b7d27e_contact', 'off') and
         is_state('binary_sensor.0x00158d0009cded84_occupancy', 'off') }}
    for:
      minutes: 40     
  condition:
    - condition: state
      entity_id: switch.spoty_master_vana
      state: 'on'
  action:
    - service: switch.turn_off
      entity_id: switch.spoty_master_vana
      
