# automation garderob

- alias: "mastergarderob_light_control"
  trigger:
    # Срабатывает только при включении (on)
    - platform: state
      entity_id:
        - binary_sensor.0x54ef441000db6adf_contact
        - binary_sensor.0x00158d0009cdeb2a_occupancy
      to: "on"
  action:
    - choose:
        # ✅ ВКЛЮЧЕНИЕ: движение или дверь открыта
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.0x00158d0009cdeb2a_occupancy
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.0x54ef441000db6adf_contact
                  state: "on"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.spoty_garderob

        # 🕓 ВЫКЛЮЧЕНИЕ 1: оба OFF в течение 20 минут
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: binary_sensor.0x00158d0009cdeb2a_occupancy
                  state: "off"
                - condition: state
                  entity_id: binary_sensor.0x54ef441000db6adf_contact
                  state: "off"
          sequence:
            - delay: "00:20:00"
            - condition: and
              conditions:
                - condition: state
                  entity_id: binary_sensor.0x00158d0009cdeb2a_occupancy
                  state: "off"
                - condition: state
                  entity_id: binary_sensor.0x54ef441000db6adf_contact
                  state: "off"
            - service: switch.turn_off
              target:
                entity_id: switch.spoty_garderob

        # 🕓 ВЫКЛЮЧЕНИЕ 2: дверь открыта, движения нет 20 минут
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: binary_sensor.0x54ef441000db6adf_contact
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.0x00158d0009cdeb2a_occupancy
                  state: "off"
          sequence:
            - delay: "00:20:00"
            - condition: and
              conditions:
                - condition: state
                  entity_id: binary_sensor.0x54ef441000db6adf_contact
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.0x00158d0009cdeb2a_occupancy
                  state: "off"
            - service: switch.turn_off
              target:
                entity_id: switch.spoty_garderob

  mode: restart

    
