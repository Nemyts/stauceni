# Ulicinoe osvishenie

- alias: "Уличное освещение"
  initial_state: true
  trigger:
    - platform: sun
      event: sunset
      offset: "+00:05:00"
      id: "sunset"
    - platform: sun
      event: sunrise
      id: "sunrise"
    - platform: time
      at: "01:53:00"
      id: "night_off"
    - platform: time
      at: "06:30:00"
      id: "morning_on"

  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: "sunset"
                - condition: trigger  
                  id: "morning_on"
          sequence:
            - service: switch.turn_on
              target:
                entity_id:
                  - switch.podsvetka_vorot
                  - switch.podsvetka_klumby
            - service: light.turn_on
              target:
                entity_id: light.podsvetka_perednii_dvor
              data:
                brightness_pct: 30

        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: "sunrise"
                - condition: trigger
                  id: "night_off"
          sequence:
            - service: switch.turn_off
              target:
                entity_id:
                  - switch.podsvetka_vorot
                  - switch.podsvetka_klumby
            - service: light.turn_off
              target:
                entity_id: light.podsvetka_perednii_dvor
  mode: single
  


